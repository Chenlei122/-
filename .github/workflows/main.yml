name: Firestore Advice Cron

on:
  schedule:
    - cron: "*/10 * * * *"   # 每 10 分鐘（UTC）
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (force main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin google-cloud-firestore pandas joblib

      - name: Write service account key
        shell: bash
        env:
          SA_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          python - <<'PY'
          import os, json, sys, pathlib
          raw = os.environ.get("SA_JSON")
          if not raw:
              print("ERROR: Secret GOOGLE_APPLICATION_CREDENTIALS_JSON missing"); sys.exit(1)
          data = json.loads(raw)
          assert data.get("type") == "service_account"
          pathlib.Path("sa.json").write_text(raw, encoding="utf-8")
          print("Wrote sa.json for project:", data.get("project_id"))
          PY

      - name: Download model from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          sudo apt-get update -y && sudo apt-get install -y jq
          echo "Query latest release..."
          LATEST=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
                   https://api.github.com/repos/${{ github.repository }}/releases/latest)
          ASSET_URL=$(echo "$LATEST" | jq -r '.assets[] | select(.name=="behavior_health_model.zip") | .url')
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "No asset named behavior_health_model.zip in latest release."; exit 1
          fi
          echo "Downloading model asset..."
          curl -L -H "Authorization: Bearer ${GH_TOKEN}" \
               -H "Accept: application/octet-stream" \
               "$ASSET_URL" -o behavior_health_model.zip
          ls -la

      # === 強制以 main 的原始檔覆蓋兩支腳本，避免舊檔殘留 ===
      - name: Ensure scripts from repo (raw via API, force refresh)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          fetch_raw () {
            FILE="$1"
            echo "Fetching $FILE from main..."
            curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" \
                 -H "Accept: application/vnd.github.raw" \
                 "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${FILE}?ref=main" \
                 -o "${FILE}"
          }
          rm -f predict_and_advise.py firestore_predict_writeback.py
          fetch_raw predict_and_advise.py
          fetch_raw firestore_predict_writeback.py
          echo "SHA256 of predict_and_advise.py:"
          (sha256sum predict_and_advise.py || shasum -a 256 predict_and_advise.py) 2>/dev/null || true
          echo "Preview first 200 lines:"
          nl -ba predict_and_advise.py | sed -n '1,200p'

      # === 先補上 make_advice（若模組缺少），再往下跑 ===
      - name: Ensure make_advice exists (auto-patch if missing)
        shell: bash
        run: |
          set -e
          python - <<'PY' || PATCH=1
import importlib, sys
m = importlib.import_module("predict_and_advise")
if not hasattr(m, "make_advice"):
    sys.exit(1)
print("make_advice OK")
PY
          if [ "${PATCH:-}" = "1" ]; then
            echo "Patching predict_and_advise.py with a minimal make_advice shim..."
            cat >> predict_and_advise.py <<'PY'

# ---- CI-injected shim: ensure make_advice exists ----
def make_advice(record: dict, model_path: str = "behavior_health_model.joblib"):
    """
    Minimal shim used by CI when the repository version lacks make_advice.
    Tries predict_and_advise(record) if present; otherwise returns a safe fallback.
    """
    try:
        if 'predict_and_advise' in globals():
            pred, tips = predict_and_advise(record, model_path=model_path)
            return {
                "advice": {
                    "state": str(pred),
                    "tips": tips,
                    "model_version": "shim",
                    "confidence": 0.6
                }
            }
    except Exception:
        pass
    return {
        "advice": {
            "state": "ok",
            "tips": ["資料有限，維持規律作息、補水與輕量活動。", "(shim fallback)"],
            "model_version": "shim-fallback",
            "confidence": 0.3
        }
    }
# ---- end shim ----
PY
            python - <<'PY'
import importlib, inspect
m = importlib.import_module("predict_and_advise")
print("AFTER PATCH, MODULE FILE =", m.__file__)
print("HAS make_advice:", hasattr(m, "make_advice"))
print("make_advice head:\n", "\n".join(inspect.getsource(m.make_advice).splitlines()[:8]))
PY
          fi

      # === 模組自檢（非致命）：確認載到的是對的檔案，且確實有 make_advice ===
      - name: Sanity check predict_and_advise module
        continue-on-error: true
        run: |
          python - <<'PY'
          import importlib, inspect
          m = importlib.import_module("predict_and_advise")
          print("MODULE FILE =", m.__file__)
          print("HAS make_advice:", hasattr(m, "make_advice"))
          if hasattr(m, "make_advice"):
              src = inspect.getsource(m.make_advice)
              print("make_advice preview:\n", "\n".join(src.splitlines()[:6]))
          PY

      - name: Debug latest health_data
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
        run: |
          python - <<'PY'
          from google.cloud import firestore
          db = firestore.Client()
          date_ids = sorted([d.id for d in db.collection('health_data').list_documents()])
          print("Total dates:", len(date_ids))
          print("Tail dates:", date_ids[-5:])
          if date_ids:
              latest_date = date_ids[-1]
              rec_ids = sorted([r.id for r in db.collection('health_data').document(latest_date).collection('records').list_documents()])
              print(f"Latest date = {latest_date}, records count = {len(rec_ids)}")
              print("Tail times:", rec_ids[-10:])
          else:
              print("No health_data yet.")
          PY

      - name: Unzip model if needed
        run: |
          echo "Before unzip:"; ls -la
          if [ -f behavior_health_model.joblib ]; then
            echo "joblib already present."
          elif [ -f behavior_health_model.zip ]; then
            echo "Found zip, unzip to joblib..."
            unzip -o behavior_health_model.zip
          else
            echo "No model file (.joblib or .zip) found."; exit 1
          fi
          echo "After unzip:"; ls -la

      - name: Assert files exist
        shell: bash
        run: |
          for f in firestore_predict_writeback.py predict_and_advise.py behavior_health_model.joblib sa.json; do
            [ -f "$f" ] && echo "✅ $f found" || { echo "❌ MISSING: $f"; exit 1; }
          done

      # ---------- 兩個偵錯步驟：在寫入之前 ----------
      - name: Dump latest record (raw JSON)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
        run: |
          python - <<'PY'
          from google.cloud import firestore
          db = firestore.Client()
          root='health_data'
          dates = sorted([d.id for d in db.collection(root).list_documents()])
          if not dates:
              print("No dates"); raise SystemExit(0)
          latest_date = dates[-1]
          recs = sorted([r.id for r in db.collection(root).document(latest_date).collection('records').list_documents()])
          if not recs:
              print("No records under", latest_date); raise SystemExit(0)
          latest_time = recs[-1]
          ref = db.collection(root).document(latest_date).collection('records').document(latest_time)
          snap = ref.get()
          print("PATH:", ref.path)
          print("RAW:", snap.to_dict())
          PY

      - name: Dry-run advice on latest record (no write)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
        run: |
          python - <<'PY'
          from google.cloud import firestore
          from predict_and_advise import make_advice
          import json
          db = firestore.Client()
          root='health_data'
          dates = sorted([d.id for d in db.collection(root).list_documents()])
          if not dates: raise SystemExit("No dates")
          latest_date = dates[-1]
          recs = sorted([r.id for r in db.collection(root).document(latest_date).collection('records').list_documents()])
          if not recs: raise SystemExit("No records")
          latest_time = recs[-1]
          ref = db.collection(root).document(latest_date).collection('records').document(latest_time)
          data = ref.get().to_dict() or {}
          payload = make_advice(data, model_path="behavior_health_model.joblib")
          print("PATH:", ref.path)
          print("PAYLOAD-PREVIEW:", json.dumps(payload, ensure_ascii=False))
          PY

      # ---------- 正式寫入（建議先用 24 小時視窗 & 不強制覆寫） ----------
      - name: Run advice writer (verbose, last 24h, no force)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
          PYTHONUNBUFFERED: "1"
        run: |
          python -u ./firestore_predict_writeback.py \
            --key ./sa.json --root health_data --since-hours 24 \
            --verbose
          echo "If wrote==0, likely no fresh docs or unusable features."
