name: Firestore Advice Cron (Production)

on:
  schedule:
    - cron: "*/30 * * * *"   # 每 30 分鐘執行一次
  workflow_dispatch:         # 允許手動觸發

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CODE_DIR: .github    # 你的程式碼目錄
    steps:
      # 1. 快速下載程式碼 (只抓最新版，不抓歷史紀錄)
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # 2. 設定 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 快取 Python 套件 (加速關鍵！⚡)
      # 透過這步，第二次執行時 pip install 幾乎瞬間完成
      - name: Cache Pip packages
        uses: actions/cache@v4
        id: cache-pip
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-firestore-v1

      # 4. 安裝套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin google-cloud-firestore pandas joblib

      # 5. 寫入金鑰 (SA_JSON)
      - name: Write service account key
        shell: bash
        env:
          SA_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          python - <<'PY'
          import os, json, sys, pathlib
          raw = os.environ.get("SA_JSON")
          if not raw:
              print("ERROR: Secret GOOGLE_APPLICATION_CREDENTIALS_JSON missing"); sys.exit(1)
          pathlib.Path("sa.json").write_text(raw, encoding="utf-8")
          print("✅ SA Key generated.")
          PY

      # 6. 下載 AI 模型
      - name: Download model from release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ env.CODE_DIR }}
        run: |
          set -e
          sudo apt-get update -y && sudo apt-get install -y jq
          
          # 檢查是否已有解壓好的模型 (理論上 GitHub Action 每次是乾淨環境，但為了保險)
          if [ -f "behavior_health_model.joblib" ]; then echo "✅ Model already exists."; exit 0; fi

          echo "🔍 Querying latest release..."
          LATEST=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
                    https://api.github.com/repos/${{ github.repository }}/releases/latest)
          ASSET_URL=$(echo "$LATEST" | jq -r '.assets[] | select(.name=="behavior_health_model.zip") | .url')
          
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "❌ Error: No asset named behavior_health_model.zip found."; exit 1
          fi

          echo "⬇️ Downloading model..."
          curl -L -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/octet-stream" \
                "$ASSET_URL" -o behavior_health_model.zip
          
          echo "📦 Unzipping..."
          unzip -o behavior_health_model.zip
          ls -la behavior_health_model.joblib

      # 7. 正式執行 (正式模式)
      # --days 3: 只往回看 3 天 (因為舊資料我們已經補齊了)
      # 由於有增量檢查邏輯，它會自動跳過已處理的資料，速度極快
      - name: Run Production Advice Writer
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
          PYTHONUNBUFFERED: "1"
        working-directory: ${{ env.CODE_DIR }}
        run: |
          echo "🚀 Starting incremental update..."
          python -u ./firestore_predict_writeback.py \
            --key ../sa.json \
            --root health_data \
            --days 3 \
            --verbose
