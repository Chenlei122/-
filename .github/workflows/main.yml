      # 🔎 印出 health_data 現況（確認有掃到）
      - name: Debug latest health_data
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
        run: |
          python - <<'PY'
          from google.cloud import firestore
          db = firestore.Client()
          date_ids = sorted([d.id for d in db.collection('health_data').list_documents()])
          print("Total dates:", len(date_ids))
          print("Tail dates:", date_ids[-5:])
          if date_ids:
            latest_date = date_ids[-1]
            rec_ids = sorted([r.id for r in db.collection('health_data').document(latest_date).collection('records').list_documents()])
            print(f"Latest date = {latest_date}, records count = {len(rec_ids)}")
            print("Tail times:", rec_ids[-10:])
          else:
            print("No health_data yet.")
          PY

      # 🛠️ 先驗證可寫 & 路徑正確：寫入 _ping
      - name: Dump latest doc (keys) and try a write
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
        run: |
          python - <<'PY'
          from google.cloud import firestore
          from datetime import datetime, timezone

          db = firestore.Client()
          root = 'health_data'

          # 1) 找最新日期/時間 doc
          dates = sorted([d.id for d in db.collection(root).list_documents()])
          print("DATES tail:", dates[-5:])
          if not dates:
              print("No dates in collection:", root); raise SystemExit(0)

          latest_date = dates[-1]
          recs_ref = db.collection(root).document(latest_date).collection('records')
          rec_ids = sorted([r.id for r in recs_ref.list_documents()])
          print(f"Latest date = {latest_date}, record count = {len(rec_ids)}")
          if not rec_ids:
              print("No records under", latest_date); raise SystemExit(0)

          latest_time = rec_ids[-1]
          doc_ref = recs_ref.document(latest_time)
          doc = doc_ref.get()
          print("LATEST DOC PATH:", f"{root}/{latest_date}/records/{latest_time}")
          if not doc.exists:
              print("Doc not exists?"); raise SystemExit(0)

          data = doc.to_dict() or {}
          print("Raw keys:", sorted(list(data.keys())))
          print("Raw content:", data)

          # 2) 寫入 _ping 驗證寫入權限
          now = datetime.now(timezone.utc).isoformat()
          doc_ref.set({"_ping": now}, merge=True)
          print("WROTE _ping =", now)
          PY

      # （可選）先人工寫一筆 advice，確認路徑與權限完全 OK
      - name: (Optional) Write dummy advice to latest doc
        if: ${{ always() }}   # 需要時可以改成條件旗標
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
        run: |
          python - <<'PY'
          from google.cloud import firestore
          from datetime import datetime, timezone
          db = firestore.Client()
          root='health_data'
          dates = sorted([d.id for d in db.collection(root).list_documents()])
          if not dates: raise SystemExit(0)
          latest_date = dates[-1]
          recs = sorted([r.id for r in db.collection(root).document(latest_date).collection('records').list_documents()])
          if not recs: raise SystemExit(0)
          latest_time = recs[-1]
          path = f"{root}/{latest_date}/records/{latest_time}"
          doc_ref = db.document(path)

          now = datetime.now(timezone.utc).isoformat()
          payload = {
            "_advised": True,
            "_advised_at_utc": now,
            "advice": {
              "state": "ok",
              "tips": ["dummy tip: pipeline wiring ok"],
              "features_used": ["steps","weather","avg_heart_rate"],
              "model_version": "debug-dummy"
            }
          }
          doc_ref.set(payload, merge=True)
          print("DUMMY advice written to:", path)
          PY

      # ✅ 最後才跑真正的寫回程式（單一版本，verbose、不緩衝）
      - name: Run advice writer (force + verbose)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
          PYTHONUNBUFFERED: "1"
        run: |
          python -u ./firestore_predict_writeback.py \
            --key ./sa.json --root health_data --days 14 \
            --force --verbose
          echo "If wrote==0, schema mismatch or empty window."
