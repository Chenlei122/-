name: Firestore Advice Cron
on:
  schedule:
    - cron: "*/10 * * * *"        # 每 10 分鐘跑一次（UTC）
  workflow_dispatch:              # 允許手動觸發

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install firebase-admin google-cloud-firestore pandas joblib

      # 把 Secrets 中的 JSON 正確寫成檔案（避免 echo 轉義問題）
      - name: Write service account key
        shell: bash
        env:
          SA_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          python - <<'PY'
          import os, json, sys
          raw = os.environ.get("SA_JSON")
          if not raw:
              print("ERROR: Secret GOOGLE_APPLICATION_CREDENTIALS_JSON missing"); sys.exit(1)
          # 驗證 JSON
          data = json.loads(raw)
          assert data.get("type")=="service_account", "Not a service_account JSON"
          open("sa.json","w", encoding="utf-8").write(raw)
          print("Wrote sa.json for project:", data.get("project_id"))
          PY

      - name: Debug repo files (optional)
        run: |
          ls -lah
          python - <<'PY'
          import os
          for f in ["predict_and_advise.py","firestore_predict_writeback.py","behavior_health_model.joblib","sa.json"]:
              print(f, "exists?" , os.path.exists(f))
          PY

      - name: Run advice writer
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
        run: |
          python firestore_predict_writeback.py --key sa.json --root health_data --days 1
