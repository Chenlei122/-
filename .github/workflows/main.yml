name: Firestore Advice Cron
on:
  schedule:
    - cron: "*/10 * * * *"  # 每10分鐘
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install firebase-admin google-cloud-firestore pandas joblib
      - name: Write service account key
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > sa.json
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      - name: Run advice writer
        run: |
          python firestore_predict_writeback.py --key sa.json --days 1
