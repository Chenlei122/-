name: Firestore Advice Cron
on:
  schedule:
    - cron: "*/10 * * * *"    # 每 10 分鐘（UTC）
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (force main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin google-cloud-firestore pandas joblib

      - name: Write service account key
        shell: bash
        env:
          SA_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          python - <<'PY'
          import os, json, sys, pathlib
          raw = os.environ.get("SA_JSON")
          if not raw:
            print("ERROR: Secret GOOGLE_APPLICATION_CREDENTIALS_JSON missing"); sys.exit(1)
          data = json.loads(raw)
          assert data.get("type")=="service_account"
          pathlib.Path("sa.json").write_text(raw, encoding="utf-8")
          print("Wrote sa.json for project:", data.get("project_id"))
          PY

      # ⭐ 從最新 Release 下載模型 asset（名為 behavior_health_model.zip）
      - name: Download model from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          sudo apt-get update -y && sudo apt-get install -y jq
          echo "Query latest release..."
          LATEST=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
                   https://api.github.com/repos/${{ github.repository }}/releases/latest)
          ASSET_URL=$(echo "$LATEST" | jq -r '.assets[] | select(.name=="behavior_health_model.zip") | .url')
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "No asset named behavior_health_model.zip in latest release."; exit 1
          fi
          echo "Downloading model asset..."
          curl -L -H "Authorization: Bearer ${GH_TOKEN}" \
               -H "Accept: application/octet-stream" \
               "$ASSET_URL" -o behavior_health_model.zip
          ls -la

      - name: Unzip model if needed
        run: |
          echo "Before unzip:"; ls -la
          if [ -f behavior_health_model.joblib ]; then
            echo "joblib already present."
          elif [ -f behavior_health_model.zip ]; then
            echo "Found zip, unzip to joblib..."
            unzip -o behavior_health_model.zip
          else
            echo "No model file (.joblib or .zip) found."; exit 1
          fi
          echo "After unzip:"; ls -la

      - name: Assert files exist
        shell: bash
        run: |
          for f in firestore_predict_writeback.py predict_and_advise.py behavior_health_model.joblib sa.json; do
            [ -f "$f" ] && echo "✅ $f found" || { echo "❌ MISSING: $f"; exit 1; }
          done

      - name: Run advice writer
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
        run: |
          python ./firestore_predict_writeback.py --key ./sa.json --root health_data --days 1
