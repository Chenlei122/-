      - name: Debug repo files (optional)
        run: |
          echo "PWD:"; pwd
          echo "Workspace:" $GITHUB_WORKSPACE
          ls -la
          echo "--- find python files ---"
          find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name "*.py" -print
          echo "--- existence check ---"
          python - <<'PY'
          import os
          for f in ["predict_and_advise.py","firestore_predict_writeback.py","behavior_health_model.joblib","sa.json"]:
              print(f, "=>", os.path.exists(f), "abs:", os.path.abspath(f))
          PY

      - name: Run advice writer
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
        run: |
          python "$GITHUB_WORKSPACE/firestore_predict_writeback.py" --key "$GITHUB_WORKSPACE/sa.json" --root health_data --days 1
